<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eficiência por Posto — 408/409</title>
<style>
:root{
  --dark:#1A1916; --dark2:#26241F; --orange:#E8731A; --orange-soft:#FBE2CE;
  --cream:#F2F1EF; --paper:#FFFFFF; --line:#D9D5CF; --gray:#8A857D;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,Roboto,sans-serif;background:var(--cream);color:var(--dark);padding-bottom:40px}

header{background:var(--dark);color:var(--cream);padding:16px 16px 0}
header .brand{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
header .brand b{font-size:1.15rem;letter-spacing:.5px}
header .brand span{color:var(--orange);font-weight:700;font-size:.8rem;border:1px solid var(--orange);border-radius:4px;padding:1px 8px}
header .sub{color:var(--gray);font-size:.72rem;margin-top:4px}
.tabs{display:flex;gap:4px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:var(--dark2);color:var(--gray);border:none;font-weight:700;font-size:.78rem;
  padding:10px 14px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap}
.tab.active{background:var(--cream);color:var(--dark)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gray);margin-right:6px}
.tab.active .dot{background:var(--orange)}

main{padding:14px 12px;max-width:900px;margin:0 auto}
.page{display:none}.page.show{display:block}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.gcard{background:var(--dark);border-radius:12px;padding:14px;color:var(--cream);cursor:pointer;border:1px solid var(--dark)}
.gcard .nm{font-size:.7rem;font-weight:700;letter-spacing:.8px;color:var(--gray);text-transform:uppercase}
.gcard .pct{font-size:2rem;font-weight:800;color:var(--orange);line-height:1.15;font-variant-numeric:tabular-nums}
.gcard .pct.ok{color:#6FCF8E}
.gcard .meta-line{height:5px;background:var(--dark2);border-radius:3px;margin-top:8px;position:relative;overflow:hidden}
.gcard .meta-line i{position:absolute;left:0;top:0;bottom:0;background:var(--orange);border-radius:3px}
.gcard .meta-line.ok i{background:#6FCF8E}
.gcard .det{font-size:.68rem;color:var(--gray);margin-top:6px}
.gsum{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.8rem}
.gsum b{color:var(--orange)}

.hero{background:var(--dark);border-radius:14px;padding:16px;color:var(--cream);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hero .big{font-size:2.9rem;font-weight:800;color:var(--orange);font-variant-numeric:tabular-nums;line-height:1}
.hero .big.ok{color:#6FCF8E}
.hero .lbl{font-size:.68rem;letter-spacing:.8px;color:var(--gray);text-transform:uppercase;font-weight:700}
.hero .kv{margin-left:auto;text-align:right;font-size:.78rem;display:grid;gap:2px}
.hero .kv b{color:var(--orange)}
.metabar{flex-basis:100%;height:7px;background:var(--dark2);border-radius:4px;position:relative;overflow:hidden}
.metabar i{position:absolute;left:0;top:0;bottom:0;background:var(--orange);border-radius:4px;transition:width .3s}
.metabar.ok i{background:#6FCF8E}
.metabar .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--cream);opacity:.85}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden}
.panel h3{background:var(--orange);color:#fff;font-size:.75rem;letter-spacing:.8px;text-transform:uppercase;padding:9px 14px}
.hrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;padding:12px 14px}
.field label{display:block;font-size:.65rem;font-weight:700;letter-spacing:.5px;color:var(--gray);text-transform:uppercase;margin-bottom:3px}
.field input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:1rem;font-weight:700;
  text-align:center;background:var(--cream);color:var(--dark)}
.field input:focus{outline:2px solid var(--orange);border-color:var(--orange)}
.calc{display:flex;gap:10px;flex-wrap:wrap;padding:0 14px 12px}
.calc .chip{background:var(--orange-soft);border-radius:8px;padding:7px 12px;font-size:.78rem;font-weight:700}
.calc .chip small{display:block;font-weight:700;font-size:.6rem;color:var(--gray);text-transform:uppercase;letter-spacing:.5px}

.carbar{display:flex;gap:8px;padding:12px 14px;align-items:center;flex-wrap:wrap}
.carbar input{flex:1;min-width:150px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:.9rem;background:var(--cream)}
.carbar .cnt{font-size:.72rem;color:var(--gray);font-weight:700}
.btn{border:none;border-radius:8px;padding:9px 14px;font-weight:700;font-size:.78rem;cursor:pointer}
.btn.ghost{background:var(--cream);color:var(--dark);border:1px solid var(--line)}
.list{max-height:430px;overflow-y:auto}
.car{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer}
.car:nth-child(even){background:var(--cream)}
.car .chk{width:20px;height:20px;border:2px solid var(--line);border-radius:6px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:.75rem;color:#fff}
.car.on .chk{background:var(--orange);border-color:var(--orange)}
.car .ordem{font-weight:800;font-size:.82rem}
.car .mod{font-size:.68rem;color:var(--gray)}
.car .hrsv{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;font-size:.9rem}
.car.on .hrsv{color:var(--orange)}
.empty{padding:18px;text-align:center;color:var(--gray);font-size:.8rem}

.toolrow{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
@media print{
  header .tabs,.carbar,.toolrow{display:none}
  .page{display:block!important;page-break-after:always}
  .list{max-height:none;overflow:visible}
  body{background:#fff}
}
</style>
</head>

const POSTOS = [
  {id:'p010', nome:'010–055',    desc:'Centros 010–055 + LG104'},
  {id:'p60',  nome:'60/70/75',   desc:'Centros 060·070·075'},
  {id:'p80',  nome:'80/90/100',  desc:'Centros 080·090·100'},
  {id:'p110', nome:'110/120',    desc:'Centros 110·120'},
];
const CAMPOS = [
  ['colab','Total colab.'],['faltas','Faltas'],['inss','INSS'],
  ['emprest','Emprestados'],['ferias','Férias'],['he','Hora extra'],['meta','Meta %']
];
const LSKEY = 'efic_postos_408409_v1';

let S = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem(LSKEY)); if(s) return s; }catch(e){}
  const s = {};
  POSTOS.forEach(p=>{ s[p.id] = {colab:0,faltas:0,inss:0,emprest:0,ferias:0,he:0,meta:53.55,sel:[]}; });
  return s;
}
POSTOS.forEach(p=>{ if(!S[p.id]) S[p.id]={colab:0,faltas:0,inss:0,emprest:0,ferias:0,he:0,meta:53.55,sel:[]}; });
function save(){ try{ localStorage.setItem(LSKEY, JSON.stringify(S)); }catch(e){} }

function horasDisp(st){ return Math.max(0,(st.colab - st.faltas - st.inss - st.ferias - st.emprest))*8.8 + st.he*5.5; }
function horasProd(pid){
  const st = S[pid];
  return st.sel.reduce((t,o)=>{ const c = CARROS.find(c=>c.o===o); return t + (c?c[pid]:0); },0);
}
function efic(pid){
  const d = horasDisp(S[pid]); if(!d) return null;
  return horasProd(pid)/d*100;
}
const f1 = n => n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});

const tabsEl = document.getElementById('tabs');
const mainEl = document.getElementById('main');
let active = 'geral';

function buildTabs(){
  tabsEl.innerHTML = '';
  [{id:'geral',nome:'GERAL'},...POSTOS].forEach(t=>{
    const b = document.createElement('button');
    b.className = 'tab'+(active===t.id?' active':'');
    b.innerHTML = '<span class="dot"></span>'+t.nome;
    b.onclick = ()=>{ active = t.id; render(true); };
    tabsEl.appendChild(b);
  });
}

function pageGeral(){
  const pg = document.createElement('div'); pg.className='page show';
  const grid = document.createElement('div'); grid.className='grid';
  let totProd=0, totDisp=0;
  POSTOS.forEach(p=>{
    const st=S[p.id], e=efic(p.id), prod=horasProd(p.id), disp=horasDisp(st);
    totProd+=prod; totDisp+=disp;
    const ok = e!==null && e>=st.meta;
    const card=document.createElement('div'); card.className='gcard';
    card.innerHTML = `<div class="nm">Posto ${p.nome}</div>
      <div class="pct ${ok?'ok':''}">${e===null?'—':f1(e)+'%'}</div>
      <div class="meta-line ${ok?'ok':''}"><i style="width:${e===null?0:Math.min(100,e/st.meta*100)}%"></i></div>
      <div class="det">${st.sel.length} carro${st.sel.length===1?'':'s'} · ${f1(prod)}h / ${f1(disp)}h · meta ${f1(st.meta)}%</div>`;
    card.onclick=()=>{ active=p.id; render(true); };
    grid.appendChild(card);
  });
  pg.appendChild(grid);
  const eg = totDisp? totProd/totDisp*100 : null;
  const sum=document.createElement('div'); sum.className='gsum';
  sum.innerHTML = `Consolidado dos postos: <b>${eg===null?'—':f1(eg)+'%'}</b> · Horas prod. <b>${f1(totProd)}</b> · Horas disp. <b>${f1(totDisp)}</b>`;
  pg.appendChild(sum);
  const tr=document.createElement('div'); tr.className='toolrow';
  tr.innerHTML = `<button class="btn ghost" onclick="window.print()">Imprimir / PDF</button>
    <button class="btn ghost" id="btnReset">Zerar tudo</button>`;
  pg.appendChild(tr);
  mainEl.appendChild(pg);
  document.getElementById('btnReset').onclick=()=>{
    if(confirm('Zerar todos os postos (carros e horas)?')){ localStorage.removeItem(LSKEY); S=load(); render(true); }
  };
}

    pg.querySelector('#cHE').textContent=f1(st.he*5.5);
    pg.querySelector('#cDisp').textContent=f1(disp);
    cnt.textContent = st.sel.length+' selecionado'+(st.sel.length===1?'':'s');
  }

  /* lista em ordem fixa (crescente por ordem) — clique alterna no lugar */
  function drawList(){
    const q=busca.value.trim().toUpperCase();
    list.innerHTML='';
    const shown = CARROS.filter(c=>!q || c.o.toUpperCase().includes(q) || c.m.toUpperCase().includes(q));
    if(!shown.length){ list.innerHTML='<div class="empty">Nenhum carro encontrado.</div>'; refresh(); return; }
    shown.slice(0,120).forEach(c=>{
      const on=st.sel.includes(c.o);
      const row=document.createElement('div'); row.className='car'+(on?' on':'');
      row.innerHTML=`<div class="chk">${on?'✓':''}</div>
        <div><div class="ordem">${c.o}</div><div class="mod">${c.m||'—'}</div></div>
        <div class="hrsv">${f1(c[p.id])}h</div>`;
      row.onclick=()=>{
        const isOn=st.sel.includes(c.o);
        if(isOn) st.sel=st.sel.filter(x=>x!==c.o); else st.sel.push(c.o);
        save();
        row.classList.toggle('on',!isOn);
        row.querySelector('.chk').textContent = isOn?'':'✓';
        refresh();
      };
      list.appendChild(row);
    });
    if(shown.length>120){
      const d=document.createElement('div'); d.className='empty';
      d.textContent='Mostrando 120 de '+shown.length+' — refine a busca.';
      list.appendChild(d);
    }
    refresh();
  }
  btnClr.onclick=()=>{ st.sel=[]; save(); drawList(); };
  busca.oninput=drawList;
  drawList();
  mainEl.appendChild(pg);
}

function render(scroll){
  buildTabs();
  mainEl.innerHTML='';
  if(active==='geral') pageGeral();
  else pagePosto(POSTOS.find(p=>p.id===active));
  if(scroll) window.scrollTo(0,0);
}

document.getElementById('hoje').textContent =
  new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
render(true);
</script>
</body>
</html>
